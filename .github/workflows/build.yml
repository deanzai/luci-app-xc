name: Build luci-app-xc

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check file syntax
        run: |
          set -eu
          echo "=== Lua syntax ==="
          for f in tests/test_*.lua; do
            if command -v lua5.1 >/dev/null 2>&1; then
              lua5.1 -e "assert(loadfile('$f'))" || exit 1
            fi
          done
          echo "PASS: all Lua files parse"

  build-21_02:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with SDK (21.02)
        uses: openwrt/gh-action-sdk@797d0e3d0eb13b355c3447f60d0179d4b43089e2
        env:
          ARCH: x86_64-openwrt-21.02
          PACKAGES: luci-app-xc
          BUILD_LOG: 1
          V: s
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xc-21.02
          path: bin/packages/*/luci/luci-app-xc_*.ipk

  build-24_10:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with SDK (24.10)
        uses: openwrt/gh-action-sdk@797d0e3d0eb13b355c3447f60d0179d4b43089e2
        env:
          ARCH: x86_64-24.10.8
          PACKAGES: luci-app-xc
          BUILD_LOG: 1
          V: s
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xc-24.10
          path: bin/packages/*/luci/luci-app-xc_*.ipk
