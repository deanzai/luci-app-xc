name: Build luci-app-xc

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host test runtimes
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y lua5.1
          lua5.1 -v
          node --version
      - name: Run complete host verification
        env:
          LUA51: lua5.1
        run: |
          set -eu
          sh tests/run-host.sh

  build-21_02:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with SDK (21.02)
        uses: openwrt/gh-action-sdk@797d0e3d0eb13b355c3447f60d0179d4b43089e2
        env:
          ARCH: x86_64-openwrt-21.02
          FEED_DIR: ${{ github.workspace }}/..
          PACKAGES: luci-app-xc
          BUILD_LOG: 1
          V: s
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xc-21.02
          path: |
            bin/packages/**/luci-app-xc_*.ipk
            bin/packages/**/luci-i18n-xc-zh-cn_*.ipk

  build-24_10:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with SDK (24.10)
        uses: openwrt/gh-action-sdk@797d0e3d0eb13b355c3447f60d0179d4b43089e2
        env:
          ARCH: x86_64-24.10.8
          FEED_DIR: ${{ github.workspace }}/..
          PACKAGES: luci-app-xc
          BUILD_LOG: 1
          V: s
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xc-24.10
          path: |
            bin/packages/**/luci-app-xc_*.ipk
            bin/packages/**/luci-i18n-xc-zh-cn_*.ipk
